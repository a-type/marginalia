name: margins

x-app-image: &app-image
  image: margins-app
  build:
    context: .
    args:
      APP_URL: ${APP_URL:-http://127.0.0.1:7654}
      VITE_HAPPYVIEW_CLIENT_KEY: ${VITE_HAPPYVIEW_CLIENT_KEY:-}

services:
  annotation-indexer:
    image: margins-annotation-indexer
    build:
      context: .
      dockerfile: Indexer.Dockerfile
    environment:
      HOST: '::'
      PORT: 3000
      INDEXER_DATABASE_PATH: /data/annotations.sqlite
    volumes:
      - annotation-indexer-data:/data
    restart: unless-stopped

  app:
    <<: *app-image
    environment:
      APP_URL: ${APP_URL:-http://127.0.0.1:7654}
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    expose:
      - '3000'
    restart: unless-stopped

  happyview:
    image: ghcr.io/gamesgamesgamesgamesgames/happyview:${HAPPYVIEW_VERSION:-2.15.0}
    environment:
      BASE_PATH: /api
      DATABASE_URL: ${HAPPYVIEW_DATABASE_URL:-sqlite:///data/happyview.sqlite?mode=rwc}
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_URL: ${APP_URL:-http://127.0.0.1:7654}
      RUST_LOG: ${HAPPYVIEW_RUST_LOG:-happyview=info,tower_http=info}
      SESSION_SECRET: ${HAPPYVIEW_SESSION_SECRET:?Set HAPPYVIEW_SESSION_SECRET in .env}
      TOKEN_ENCRYPTION_KEY: ${HAPPYVIEW_TOKEN_ENCRYPTION_KEY:?Set HAPPYVIEW_TOKEN_ENCRYPTION_KEY in .env}
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - happyview-data:/data
    restart: unless-stopped
    depends_on:
      - annotation-indexer

  caddy:
    image: caddy:2-alpine
    environment:
      APP_PRIVATE_DOMAIN: app
      CADDY_SITE_ADDRESS: ${APP_DOMAIN:-localhost}
      HAPPYVIEW_BASE_PATH: /api
      HAPPYVIEW_PRIVATE_DOMAIN: happyview
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - happyview
    restart: unless-stopped

  happyview-provision:
    <<: *app-image
    profiles:
      - setup
    command:
      - node
      - scripts/provision-happyview.mjs
    environment:
      APP_URL: ${APP_URL:-http://127.0.0.1:7654}
      HAPPYVIEW_ADMIN_KEY: ${HAPPYVIEW_ADMIN_KEY:-}
      HAPPYVIEW_BASE_URL: http://happyview:3000/api
      ANNOTATION_INDEXER_URL: http://annotation-indexer:3000
      VITE_HAPPYVIEW_CLIENT_KEY: ${VITE_HAPPYVIEW_CLIENT_KEY:-}
    depends_on:
      - happyview

  annotation-indexer-rebuild:
    image: margins-annotation-indexer
    build:
      context: .
      dockerfile: Indexer.Dockerfile
    profiles:
      - setup
    command: ['node', 'dist-indexer/rebuild.js']
    environment:
      HAPPYVIEW_ADMIN_KEY: ${HAPPYVIEW_ADMIN_KEY:-}
      HAPPYVIEW_BASE_URL: http://happyview:3000/api
      ANNOTATION_INDEXER_URL: http://annotation-indexer:3000
    depends_on:
      - happyview
      - annotation-indexer

volumes:
  annotation-indexer-data:
  happyview-data:
  caddy-data:
  caddy-config:
