name: Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: pnpm/action-setup@v3
        with:
          run_install: true
      - name: Run tests
        run: pnpm run -r test
      - name: Run browser tests
        run: pnpm run -r test:browser
